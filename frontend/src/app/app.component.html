<div class="app-layout" *ngIf="authService.isLoggedIn(); else unauthLayout">
  <app-navbar [currentUser]="currentUser" (logout)="onLogout()"></app-navbar>

  <div class="app-main">
    <app-sidebar [role]="currentUser?.role || 'EMPLOYEE'"></app-sidebar>
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<ng-template #unauthLayout>
  <router-outlet></router-outlet>
</ng-template>
