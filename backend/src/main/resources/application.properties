spring.application.name=elms-backend

# Server Configuration
server.port=8080
server.forward-headers-strategy=framework

# Import local credentials configuration if present (git-ignored)
spring.config.import=optional:classpath:application-local.properties, optional:file:./application-local.properties

# Spring Data JPA & HikariCP Cloud Connection Resilience
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# Swagger OpenAPI UI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs

# Application Environment Custom Property
elms.app.environment=development