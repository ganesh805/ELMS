# Local Development Database Configuration Template
# Copy this file to 'application-local.properties' in the same folder or project root
# and fill in your local credentials. DO NOT commit 'application-local.properties'.

spring.datasource.url=jdbc:mysql://localhost:3306/elms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_LOCAL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
